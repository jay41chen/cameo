services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cameo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cameo}
      POSTGRES_DB: ${POSTGRES_DB:-cameo}
    ports:
      # 只對本機開放，供測試使用。
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://cameo:cameo@postgres:5432/cameo?sslmode=disable}
      HTTP_ADDR: ":8080"
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  pgdata:
