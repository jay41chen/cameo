services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cameo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cameo}
      POSTGRES_DB: ${POSTGRES_DB:-cameo}
    ports:
      # 只對本機開放，供測試使用。
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://cameo:cameo@postgres:5432/cameo?sslmode=disable}
      HTTP_ADDR: ":8080"
      DAILY_LIMIT: ${DAILY_LIMIT:-3}
      UPLOAD_TTL: ${UPLOAD_TTL:-1h}
      EXPIRY_SWEEP_INTERVAL: ${EXPIRY_SWEEP_INTERVAL:-30s}
      SELFIE_DIR: /data/selfies
      MAX_SELFIE_BYTES: ${MAX_SELFIE_BYTES:-10485760}
      GENERATION_TTL: ${GENERATION_TTL:-2m}
      DISPATCH_SWEEP_INTERVAL: ${DISPATCH_SWEEP_INTERVAL:-2s}
      VENDOR_URL: http://vendor-sim:9000
      # 模擬環境才開：/debug/*（異常登記與重設）。設成 true 以外的值就回 404。
      DEBUG_API_ENABLED: ${DEBUG_API_ENABLED:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      # 僅供模擬：api 與 vendor-sim 共用的 webhook 簽章密鑰，不是正式密鑰。
      VENDOR_WEBHOOK_SECRET: ${VENDOR_WEBHOOK_SECRET:-cameo-sim-secret}
    volumes:
      - selfies:/data/selfies
    ports:
      - "${API_PORT:-8080}:8080"

  # 模擬廠商：收工作後向 api 取一次 /debug/faults/consume 的異常（取不到就當沒有），等 VENDOR_DELAY_SEC 秒後回呼：
  # 預設送一次成功回呼；有登記 vendor_* 異常時改送失敗、重複回呼或不回呼。不對外發布 port。
  vendor-sim:
    build: ./backend
    entrypoint: ["vendor-sim"]
    environment:
      VENDOR_DELAY_SEC: ${VENDOR_DELAY_SEC:-20}
      VENDOR_CALLBACK_URL: http://api:8080/webhooks/vendor
      VENDOR_PUBLIC_URL: http://vendor-sim:9000
      VENDOR_FAULTS_URL: http://api:8080/debug/faults/consume
      # 僅供模擬，與 api 的 VENDOR_WEBHOOK_SECRET 必須相同。
      VENDOR_WEBHOOK_SECRET: ${VENDOR_WEBHOOK_SECRET:-cameo-sim-secret}

volumes:
  pgdata:
  selfies:
